name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'sql/**'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          # HEAD~1 is needed to tell "the version changed" from "a comment
          # changed" — see the version gate below.
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          # 22, not 20: every @supabase/* package declares engines >= 22 and
          # warned on every install. A warning today is an error one minor
          # release from now, and the build machine is the cheapest place to
          # find that out late.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm ci` has broken three times and the summary page never shows which
      # npm was reading the lock. One line of state costs nothing and answers
      # the first question every time.
      - name: Versions
        if: always()
        run: node -v; npm -v

      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build Electron app
        run: npm run build

      # Publish ONLY when package.json's version actually changed.
      #
      # This workflow runs on every push to main, and until now that was
      # harmless: nobody downloaded automatically. With silent auto-update it
      # is not — every typo fix would become a release, and every release is a
      # fetch on every machine in the lab, including the designer's, in another
      # building, on whatever connection they have. The BUILD still runs on
      # every push; it is the only compile check there is.
      - name: Has the version changed?
        id: ver
        shell: pwsh
        run: |
          $now = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $prev = ''
          try { $prev = (git show HEAD~1:package.json | ConvertFrom-Json).version } catch { }
          Write-Host "eelmine='$prev' praegune='$now'"
          # No previous commit to compare against (first push, shallow clone)
          # publishes rather than skipping: a missed release is worse than one
          # extra.
          $changed = ($prev -eq '') -or ($prev -ne $now)
          "changed=$($changed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "version=$now" >> $env:GITHUB_OUTPUT

      - name: Package for Windows
        if: steps.ver.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish always --config.forceCodeSigning=false

      # electron-builder creates a DRAFT release, and electron-updater cannot
      # see drafts — so it has to be published or nobody gets the update.
      #
      # The tag is `v<version>`: electron-builder's `vPrefixedTagName` defaults
      # to true. This step asked for the bare number and got "release not
      # found". Both spellings are tried, because a release made before that
      # default was understood may carry either.
      #
      # On failure the actual release list is printed. "release not found"
      # without saying what DOES exist is a dead end, and this step has no
      # other way to be read from the summary page.
      - name: Publish release
        if: steps.ver.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $repo = "${{ github.repository }}"
          foreach ($tag in @("v$version", $version)) {
            gh release view $tag --repo $repo *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Avaldan release'i $tag"
              gh release edit $tag --draft=false --repo $repo
              exit $LASTEXITCODE
            }
          }
          Write-Host "::error::Release'i ei leitud sildiga v$version ega $version"
          gh release list --repo $repo --limit 10
          exit 1
