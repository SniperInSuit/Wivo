name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'sql/**'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 22, not 20: every @supabase/* package declares engines >= 22 and
          # warned on every install. A warning today is an error one minor
          # release from now, and the build machine is the cheapest place to
          # find that out late.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm ci` has broken three times and the summary page never shows which
      # npm was reading the lock. One line of state costs nothing and answers
      # the first question every time.
      - name: Versions
        if: always()
        run: node -v; npm -v

      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build Electron app
        run: npm run build

      - name: Package for Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish always --config.forceCodeSigning=false

      # electron-builder creates a draft release. Publish it so
      # electron-updater can find it — drafts are invisible to the client.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release edit $version --draft=false --repo ${{ github.repository }}
        shell: pwsh
